# GoReleaser configuration: builds the release archives that
# .github/workflows/release.yml attaches to a GitHub Release.
#
# Validate locally with `goreleaser check`; build everything without
# publishing with `goreleaser release --snapshot --clean` (output in dist/).
version: 2

project_name: ghcli

before:
  hooks:
    # Fail the release if go.sum no longer matches the module cache.
    - go mod verify

builds:
  - id: ghcli
    main: .
    binary: ghcli
    env:
      # modernc.org/sqlite is pure Go, so every target cross-compiles
      # from one Linux runner without a C toolchain.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # {{ .Tag }} keeps the leading "v", the same form `ghcli version` prints
    # for source builds (cmd.Version in cmd/root.go).
    ldflags:
      - -s -w -X github.com/fdsouvenir/ghcli/cmd.Version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ghcli
    ids:
      - ghcli
    # ghcli_<version>_<os>_<arch>.tar.gz, for example ghcli_1.0.6_linux_amd64.tar.gz.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  # Only used when GoReleaser has to create the release itself (see below);
  # it produces the draft's starting notes from the commits since the last tag.
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  # No github.owner/name here: GoReleaser reads the repository from the
  # checkout's origin remote, which Actions points at the repository running
  # the workflow. A tag pushed to a fork therefore releases to the fork instead
  # of failing against fdsouvenir/ghcli with a token that cannot write there.
  #
  # When the release already exists (created with its notes before or with
  # the tag), GoReleaser only uploads the archives: the notes are kept (mode
  # keep-existing) and the release stays published. The title would otherwise
  # be reset to the tag, so the workflow passes the existing title through
  # RELEASE_NAME; outside the workflow the title falls back to the tag.
  #
  # When only the tag was pushed, GoReleaser creates a draft so nothing is
  # published until the maintainer has written the notes.
  name_template: '{{ envOrDefault "RELEASE_NAME" .Tag }}'
  mode: keep-existing
  draft: true
  prerelease: auto
  # A re-run of the workflow for the same tag replaces the archives it
  # already uploaded instead of failing with 422.
  replace_existing_artifacts: true

report_sizes: true
